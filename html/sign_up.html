<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
</head>
<body>
<form action="http://localhost:8080/sign_up_process" method="post">
    <div>
        <span>이름<br><input type="text" name="name"></span><br>
        <span>아이디<br><input type="text" name="id"></span><br>
        <span>비밀번호<br><input type="text" name="password"></span><br>
        <span>비밀번호 재확인<br><input type="text" name="checkPassword"></span><br>

        <button type="submit">회원가입</button>
    </div>
</form>
</body>
</html>
